<section class="contact" id="contact">
  <div class="wrap contact-grid">
    <div class="contact-info reveal">
      <span class="eyebrow-mono">GET IN TOUCH</span>
      <h2>Let's talk about your project</h2>
      <p>Fill out the form or reach out directly — we'll respond within one business day.</p>
      <div class="contact-detail"><span class="dot2"></span><div><strong>Call or text</strong><span>(972) 555-0118</span></div></div>
      <div class="contact-detail"><span class="dot2"></span><div><strong>Email</strong><span>hello@texasclickdigital.com</span></div></div>
      <div class="contact-detail"><span class="dot2"></span><div><strong>Based in</strong><span>Lewisville, TX — serving all of North Texas</span></div></div>
    </div>
    <!-- Formspree endpoint below — swap YOUR_FORM_ID if you ever need to change forms -->
    <form id="quoteForm" class="reveal" action="https://formspree.io/f/mqpkzkjz" method="POST">
      <div class="row2">
        <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" required placeholder="Full name"></div>
        <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" required placeholder="(972) 555-0000"></div>
      </div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required placeholder="you@email.com"></div>
      <div class="field"><label for="service">What do you need?</label>
        <select id="service" name="service">
          <option>Website</option>
          <option>App</option>
          <option>Marketing</option>
          <option>Social Media</option>
          <option>Video</option>
          <option>Brand / Logo</option>
          <option>Not sure yet</option>
        </select>
      </div>
      <div class="field"><label for="message">Project details</label><textarea id="message" name="message" placeholder="Tell us a bit about your business and goals"></textarea></div>
      <button type="submit" class="btn btn-primary">Start Your Project</button>
      <p class="form-note">We reply within one business day. No spam, ever.</p>
    </form>
  </div>
</section>
