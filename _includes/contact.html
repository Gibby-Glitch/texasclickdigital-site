<section class="contact" id="contact">
  <div class="wrap contact-grid">
    <div class="contact-info reveal">
      <span class="eyebrow-mono">GET IN TOUCH</span>
      <h2>Let's talk about your project</h2>
      <p>Fill out the form or reach out directly — we'll respond within one business day.</p>
      <div class="contact-detail">
        <span class="contact-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </span>
        <div><strong>Call or text</strong><span>(682) 209-6587</span></div>
      </div>
      <div class="contact-detail">
        <span class="contact-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="m22 6-10 7L2 6"/></svg>
        </span>
        <div><strong>Email</strong><span>gibbytnt@gmail.com</span></div>
      </div>
      <div class="contact-detail">
        <span class="contact-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </span>
        <div><strong>Based in</strong><span>Lewisville, TX — serving all of North Texas</span></div>
      </div>
    </div>
    <!-- Formspree endpoint below — swap YOUR_FORM_ID if you ever need to change forms -->
    <form id="quoteForm" class="reveal" action="https://formspree.io/f/mqpkzkjz" method="POST">
      <div class="row2">
        <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" required placeholder="Full name"></div>
        <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" required placeholder="(682) 209-0000"></div>
      </div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required placeholder="you@email.com"></div>
      <div class="field"><label for="service">What do you need?</label>
        <select id="service" name="service">
          <option>Website</option>
          <option>App</option>
          <option>Marketing</option>
          <option>Social Media</option>
          <option>Video</option>
          <option>Brand / Logo</option>
          <option>Not sure yet</option>
        </select>
      </div>
      <div class="field"><label for="message">Project details</label><textarea id="message" name="message" placeholder="Tell us a bit about your business and goals"></textarea></div>
      <button type="submit" class="btn btn-primary">Start Your Project</button>
      <p class="form-note">We reply within one business day. No spam, ever.</p>
    </form>
  </div>
</section>
